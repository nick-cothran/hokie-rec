services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/auth.sql:/docker-entrypoint-initdb.d/02_auth.sql:ro
      - ./db/roster.sql:/docker-entrypoint-initdb.d/03_roster.sql:ro
      - ./db/seed.sql:/seed.sql:ro
volumes:
  postgres_data:
